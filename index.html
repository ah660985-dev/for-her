<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخر محاولة للرجوع للحياه 🤍</title>
    <meta property="og:title" content="اخر محاولة للرجوع للحياه 🤍">
    <meta property="og:description" content="من قلبي لـ روضا ✨">
    <meta property="og:type" content="website">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Montserrat:wght@400;600&display=swap');
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.8s ease, transform 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 50px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .heart-btn {
            font-size: 5rem;
            cursor: pointer;
            display: inline-block;
            animation: beat 1.2s infinite;
            transition: transform 0.3s ease;
            user-select: none;
        }

        .heart-btn:hover { transform: scale(1.15); }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .click-hint {
            font-family: 'Montserrat', sans-serif;
            color: #8d99ae;
            font-size: 1rem;
            margin-top: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            z-index: 100;
        }

        .progress-bar {
            height: 100%;
            width: 25%;
            background: #d90429;
            transition: width 0.6s ease;
        }

        .container {
            max-width: 550px;
            width: 90%;
            background: rgba(255, 255, 255, 0.96);
            margin: 20px auto;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 2;
            position: relative;
            min-height: 400px;
        }

        .page {
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .page.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .message {
            color: #2b2d42;
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 25px;
            white-space: pre-line;
            font-weight: 500;
            margin-top: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .gallery.two-images { grid-template-columns: 1fr 1fr; }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .btn {
            background: #d90429;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-forgive {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            padding: 15px 40px;
            font-size: 1.25rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
            margin-top: 20px;
            animation: pulse 2s infinite;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            z-index: 300;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .modal-overlay.show { display: flex; opacity: 1; }

        .modal-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 25px;
            max-width: 450px;
            width: 85%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.5s ease;
        }

        .modal-overlay.show .modal-card { transform: scale(1); }

        .modal-card img {
            width: 100%; height: auto; max-height: 65vh; object-fit: contain; border-radius: 20px;
        }

        .close-modal {
            background: #ff4d6d; color: white; border: none; padding: 8px 25px;
            font-size: 1.2rem; border-radius: 50px; cursor: pointer; margin-top: 15px;
        }

        .heart {
            position: absolute; color: #ff4d6d; font-size: 20px;
            animation: fall linear infinite; z-index: 1; bottom: -20px;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-card">
            <div class="heart-btn" onclick="startExperience()">❤️</div>
            <div class="click-hint">Tap to open</div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="our-song.mp3" type="audio/mpeg">
    </audio>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="container" id="container">
        <div class="page active" id="page1">
            <div class="message">وحشتيني اوي و وحشني كل حاجه عشتها معاكي..</div>
            <div class="gallery two-images">
                <img src="https://i.ibb.co/7N6Kbh9R/715411908-2227611328064754-4078195384724115324-n.jpg" alt="1">
                <img src="https://i.ibb.co/4RhGCnLy/718293896-2907261549627856-1239871501085989126-n.jpg" alt="2">
            </div>
            <div class="nav-icon" onclick="nextPage(2)"><span>←</span> <span>🤍</span></div>
        </div>
        
        <!-- Add other pages here in similar structure -->
        <div class="page" id="page4">
            <div class="message">وعد مني كل ايامنا هتكون زي اليوم ده و احلى..</div>
            <button class="btn-forgive" onclick="showForgiveness()">موافقه؟ ❤️</button>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let musicStarted = false;
        let heartInterval;

        function startExperience() {
            const audio = document.getElementById('bgMusic');
            audio.play();
            document.getElementById('welcomeScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('welcomeScreen').style.display = 'none', 800);
            heartInterval = setInterval(createHeart, 300);
        }

        function showForgiveness() {
            document.getElementById('forgiveModal').classList.add('show');
            clearInterval(heartInterval);
            heartInterval = setInterval(createHeart, 80);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
