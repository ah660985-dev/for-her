<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخر محاولة للرجوع للحياه 🤍</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        * { box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }

        /* Welcome Screen */
        #welcomeScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 500; transition: opacity 0.8s ease; }
        .heart-btn { font-size: 5rem; cursor: pointer; animation: beat 1.2s infinite; }
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .click-hint { color: #8d99ae; font-size: 1.2rem; margin-top: 20px; font-weight: 600; text-transform: uppercase; }

        /* Main Container */
        .container { max-width: 550px; width: 90%; background: rgba(255, 255, 255, 0.96); padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        .page { display: none; }
        .page.active { display: block; }
        .message { color: #2b2d42; font-size: 1.25rem; line-height: 1.8; margin: 20px 0; }
        .nav-icon { font-size: 2.5rem; cursor: pointer; display: inline-block; transition: transform 0.3s; margin-top: 20px; }
        .nav-icon:hover { transform: scale(1.1); }
        .btn-forgive { background: #d90429; color: white; padding: 15px 40px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; font-size: 1.25rem; margin-top: 20px; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 600; align-items: center; justify-content: center; }
        .modal-card { width: 90%; max-width: 400px; text-align: center; }
        .modal-card img { width: 100%; border-radius: 20px; }
        .close-modal { cursor: pointer; font-size: 2rem; color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="welcomeScreen" onclick="startExperience()">
        <div class="heart-btn">❤️</div>
        <div class="click-hint">Tap to open</div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="our-song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="page active" id="page1">
            <div class="message">وحشتيني اوي و وحشني كل حاجه عشتها معاكي..</div>
            <div class="nav-icon" onclick="nextPage(2)">🤍</div>
        </div>
        <div class="page" id="page2">
            <div class="message">عارف اني اذيتك بس والله مكنش بقصد..</div>
            <div class="nav-icon" onclick="nextPage(3)">🤍</div>
        </div>
        <div class="page" id="page3">
            <div class="message">مستعد اصالح روضا اللي حبتها زمان دي..</div>
            <div class="nav-icon" onclick="nextPage(4)">🤍</div>
        </div>
        <div class="page" id="page4">
            <div class="message">وعد مني كل ايامنا هتكون زي اليوم ده و احلى..</div>
            <button class="btn-forgive" onclick="showModal()">موافقه؟ ❤️</button>
        </div>
    </div>

    <div class="modal-overlay" id="forgiveModal">
        <div class="modal-card">
            <img src="https://i.ibb.co/PZVYPj6N/716189897-1030720482715349-1905136625468873606-n.jpg" alt="حب">
            <div class="close-modal" onclick="closeModal()">🤍</div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        function startExperience() {
            document.getElementById('bgMusic').play();
            document.getElementById('welcomeScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('welcomeScreen').style.display = 'none', 800);
        }
        function nextPage(n) {
            document.getElementById('page' + currentPage).classList.remove('active');
            currentPage = n;
            document.getElementById('page' + currentPage).classList.add('active');
        }
        function showModal() { document.getElementById('forgiveModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('forgiveModal').style.display = 'none'; }
    </script>
</body>
</html>
