<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة لـ روضا 🤍</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden; position: relative;
        }

        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #f0f0f0; z-index: 100; }
        .progress-bar { height: 100%; width: 0%; background: #d90429; transition: width 0.6s ease; }

        .container {
            max-width: 550px; width: 90%; background: rgba(255, 255, 255, 0.96);
            margin: 20px auto; padding: 30px; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center;
            z-index: 2; position: relative; min-height: 400px;
        }

        .page { display: none; opacity: 0; transition: opacity 0.6s ease; }
        .page.active { display: block; opacity: 1; }

        .message { color: #2b2d42; font-size: 1.3rem; line-height: 1.8; margin-bottom: 25px; font-weight: 500; }

        .btn {
            background: #d90429; color: white; border: none; padding: 15px 40px;
            font-size: 1.2rem; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(217, 4, 41, 0.3);
        }

        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .gallery img { width: 100%; height: 250px; object-fit: cover; border-radius: 18px; }

        .heart { position: absolute; color: #ff4d6d; font-size: 20px; animation: fall linear infinite; z-index: 1; }
        @keyframes fall { 0% { transform: translateY(-10vh); } 100% { transform: translateY(110vh); } }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto"><source src="our-song.mp3" type="audio/mpeg"></audio>

    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

    <div class="container">
        <!-- صفحة الترحيب -->
        <div class="page active" id="welcomePage">
            <div style="font-size: 4rem; margin-top: 50px;">🤍</div>
            <h2 style="color: #d90429;">روضـا..</h2>
            <button class="btn" onclick="startExperience()" style="margin-top: 30px;">Tap to open</button>
        </div>

        <!-- الصفحات -->
        <div class="page" id="page1">
            <div class="message">وحشتيني اوي و وحشني كل حاجه عشتها معاكي..</div>
            <div class="gallery"><img src="https://i.ibb.co/7N6Kbh9R/715411908-2227611328064754-4078195384724115324-n.jpg"><img src="https://i.ibb.co/4RhGCnLy/718293896-2907261549627856-1239871501085989126-n.jpg"></div>
            <button class="btn" onclick="nextPage(2)">التالي</button>
        </div>

        <!-- بقية الصفحات كما في كودك الأصلي -->
        <div class="page" id="page2">
            <div class="message">عارف اني اذيتك.. مستعد احاول طوول العمر عشان تسامحيني.</div>
            <button class="btn" onclick="nextPage(3)">التالي</button>
        </div>

        <div class="page" id="page3">
            <div class="message">لو بس تديني فرصه احاول اصالح روضا اللي حبتها زمان..</div>
            <button class="btn" onclick="nextPage(4)">موافقه؟ ❤️</button>
        </div>
    </div>

    <script>
        function startExperience() {
            const audio = document.getElementById('bgMusic');
            audio.play();
            document.getElementById('welcomePage').classList.remove('active');
            document.getElementById('page1').classList.add('active');
            document.getElementById('progressBar').style.width = '25%';
        }

        function nextPage(n) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + n).classList.add('active');
            document.getElementById('progressBar').style.width = (n * 25) + '%';
        }

        setInterval(() => {
            const h = document.createElement('div');
            h.classList.add('heart'); h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }, 300);
    </script>
</body>
</html>
