<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من قلبي لـ روضا 🤍</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        * { box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; position: relative; }
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #f0f0f0; z-index: 100; }
        .progress-bar { height: 100%; width: 0%; background: #d90429; transition: width 0.6s ease; }
        .container { max-width: 550px; width: 90%; background: rgba(255, 255, 255, 0.96); margin: 20px auto; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; z-index: 2; position: relative; min-height: 400px; }
        .page { display: none; opacity: 0; transition: opacity 0.6s ease; }
        .page.active { display: block; opacity: 1; }
        .message { color: #2b2d42; font-size: 1.25rem; line-height: 1.8; margin-bottom: 25px; font-weight: 500; margin-top: 20px; }
        .gallery { display: grid; gap: 15px; margin-top: 20px; margin-bottom: 25px; }
        .gallery img { width: 100%; height: 280px; object-fit: cover; border-radius: 18px; }
        .btn { background: #d90429; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; }
        .nav-icon { font-size: 2.5rem; cursor: pointer; color: #d90429; margin: 20px auto; }
        /* تصميم البوب أب */
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .popup img { max-width: 90%; max-height: 80%; border-radius: 20px; }
        .close-popup { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto"><source src="our-song.mp3" type="audio/mpeg"></audio>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

    <div class="container">
        <!-- صفحة الترحيب -->
        <div class="page active" id="page0">
            <div style="font-size: 4rem; margin: 50px 0; cursor: pointer;" onclick="startApp()">❤️</div>
            <p>Tap to open</p>
        </div>

        <!-- الصفحات (1-4 نفس محتواك) -->
        <div class="page" id="page1"><div class="message">وحشتيني اوي..</div><button class="btn" onclick="nextPage(2)">التالي</button></div>
        <div class="page" id="page2"><div class="message">عارف اني اذيتك..</div><button class="btn" onclick="nextPage(3)">التالي</button></div>
        <div class="page" id="page3"><div class="message">لو بس تديني فرصه..</div><button class="btn" onclick="nextPage(4)">التالي</button></div>
        
        <!-- الصفحة الخامسة -->
        <div class="page" id="page4">
            <div class="message">موافقه؟ ❤️</div>
            <button class="btn" onclick="showPopup()">موافقه؟ ❤️</button>
        </div>
    </div>

    <!-- البوب أب -->
    <div class="popup" id="popup">
        <span class="close-popup" onclick="closePopup()">🤍</span>
        <img src="https://i.ibb.co/PZVYPj6N/716189897-1030720482715349-1905136625468873606-n.jpg">
    </div>

    <script>
        function startApp() {
            document.getElementById('bgMusic').play();
            document.getElementById('page0').classList.remove('active');
            document.getElementById('page1').classList.add('active');
            document.getElementById('progressBar').style.width = '20%';
        }
        function nextPage(n) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + n).classList.add('active');
            document.getElementById('progressBar').style.width = (n * 20) + '%';
        }
        function showPopup() { document.getElementById('popup').style.display = 'flex'; }
        function closePopup() { document.getElementById('popup').style.display = 'none'; }
    </script>
</body>
</html>
